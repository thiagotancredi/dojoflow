services:
  postgres:
    image: postgres:17
    container_name: dojoflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dojoflow
    ports:
      - "5434:5432"
    volumes:
      - dojoflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: dojoflow_redis
    ports:
      - "6380:6379"

volumes:
  dojoflow_postgres_data:
